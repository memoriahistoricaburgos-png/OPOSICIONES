<script>
"use strict";
/* ========== UTILIDADES ========== */
const $=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L='ABCDE', uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const hash=s=>{let h=5381;for(const c of norm(s))h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)};
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:type||'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ========== DB (IndexedDB): preguntas | errores | historial | config ========== */
const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('oposiciones',4);
  r.onupgradeneeded=()=>{const d=r.result,mk=(n,o)=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,o)}; /* solo crea lo que falte: nunca borra datos */ mk('preguntas',{keyPath:'id'});mk('errores',{keyPath:'id'});mk('historial',{keyPath:'id',autoIncrement:true});mk('config',{keyPath:'k'});mk('pdfs',{keyPath:'name'});mk('pendientes',{keyPath:'id'});mk('pdfdata',{keyPath:'name'});mk('libs',{keyPath:'k'})};
  r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 req(s,m,f){return new Promise((res,rej)=>{const t=DB.db.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
 all:s=>DB.req(s,'readonly',o=>o.getAll()),get:(s,k)=>DB.req(s,'readonly',o=>o.get(k)),
 put:(s,v)=>DB.req(s,'readwrite',o=>o.put(v)),del:(s,k)=>DB.req(s,'readwrite',o=>o.delete(k)),clear:s=>DB.req(s,'readwrite',o=>o.clear()),
 putMany(s,a){return new Promise((res,rej)=>{const t=DB.db.transaction(s,'readwrite'),o=t.objectStore(s);a.forEach(v=>o.put(v));t.oncomplete=res;t.onerror=()=>rej(t.error)})}};
let CFG={k:'cfg',theme:'auto',corte:0,simN:100,simMin:90,apiKey:'',iaModel:'claude-sonnet-5-5',iaWeb:true,incluirDesf:false,acierto:1.2,fallo:0.4,temario:'',exitN:2,blankErr:false,sessions:0,lastBackup:0};
const saveCfg=()=>DB.put('config',CFG);
function applyTheme(){const d=CFG.theme==='oscuro'||(CFG.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=d?'dark':'light'}

/* ========== LIBRERÍAS: CDN o copia local guardada en IndexedDB (uso sin conexión) ========== */
const LIBS={pdf:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',pdfw:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
 tess:'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js',tessw:'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/worker.min.js',
 core:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.0.0/tesseract-core-simd-lstm.wasm.js',spa:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/spa/4.0.0_best_int/spa.traineddata.gz'};
const LB={}; // URLs blob de las copias locales
async function libBlob(k){if(LB[k])return LB[k];const r=await DB.get('libs',k);if(!r)return null;return LB[k]=URL.createObjectURL(new Blob([r.data],{type:'text/javascript'}))}
const addScript=src=>new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=()=>r(true);s.onerror=()=>r(false);document.head.appendChild(s)});
async function ensureLibs(){ // si el CDN no cargó (sin internet), usa la copia guardada
 if(!window.pdfjsLib){const b=await libBlob('pdf');if(b)await addScript(b)}
 if(!window.Tesseract){const b=await libBlob('tess');if(b)await addScript(b)}}
/* El idioma español se deja en la caché propia de Tesseract (IndexedDB «keyval-store») para que el OCR no descargue nada */
async function seedTessLang(){const r=await DB.get('libs','spa');if(!r)return;
 await new Promise(res=>{const o=indexedDB.open('keyval-store');o.onupgradeneeded=()=>o.result.createObjectStore('keyval');
  o.onsuccess=()=>{const d=o.result;if(!d.objectStoreNames.contains('keyval')){d.close();return res()}const t=d.transaction('keyval','readwrite');t.objectStore('keyval').put(new Uint8Array(r.data),'./spa.traineddata');t.oncomplete=t.onerror=()=>{d.close();res()}};o.onerror=()=>res()})}
async function prepareOffline(){const el=$('offst'),keys=Object.keys(LIBS);let tot=0;
 try{for(let i=0;i<keys.length;i++){const k=keys[i];el.textContent=`Descargando ${i+1}/${keys.length}…`;const r=await fetch(LIBS[k]);if(!r.ok)throw new Error('HTTP '+r.status+' en '+LIBS[k]);
   const data=k==='spa'?await r.arrayBuffer():await r.text();tot+=k==='spa'?data.byteLength:data.length;await DB.put('libs',{k,data,fecha:Date.now()})}
  await seedTessLang();el.textContent=`Listo: ${(tot/1e6).toFixed(1)} MB guardados. La importación y el OCR funcionan sin internet.`}
 catch(e){el.textContent='No se pudo descargar ('+(e.message||e)+'). Necesitas internet para este paso.'}}
let OCRW=null;
async function tessWorkerBlob(){if(LB.tcomb)return LB.tcomb;const a=await DB.get('libs','core'),b=await DB.get('libs','tessw');if(!a||!b)return null;
 return LB.tcomb=URL.createObjectURL(new Blob([a.data,'\n;\n',b.data],{type:'text/javascript'}))} // el motor queda definido antes de que el worker lo pida
async function ocrCanvas(c){if(!OCRW){const wb=await tessWorkerBlob();await seedTessLang();
  OCRW=await Tesseract.createWorker('spa',1,wb?{workerPath:wb,workerBlobURL:false}:{})}
 return (await OCRW.recognize(c)).data.text}
let WK=null;
async function pdfWorker(){if(WK)return WK;
 WK=(async()=>{let src=await libBlob('pdfw');
  if(!src){try{const code=await (await fetch(LIBS.pdfw)).text();src=URL.createObjectURL(new Blob([code],{type:'text/javascript'}))}catch(e){src=LIBS.pdfw}}
  pdfjsLib.GlobalWorkerOptions.workerSrc=src;
  await addScript(src); // respaldo: PDF.js puede trabajar sin Worker si este falla (p. ej. desde file://)
 })();return WK}
/* Lee el texto de una página. Si detecta dos columnas (un canal vertical cerca del centro que casi nada cruza), lee primero la izquierda y luego la derecha. */
async function pageText(p){const c=await p.getTextContent(),W=p.getViewport({scale:1}).width,its=c.items.filter(i=>i.str&&i.str.trim());
 const lines=arr=>{const rows={};arr.forEach(i=>{const y=Math.round(i.transform[5]/3);(rows[y]=rows[y]||[]).push(i)});
  return Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean)};
 if(its.length>20){let best=null;
  for(let f=.35;f<=.651;f+=.01){const x=W*f,cross=its.filter(i=>i.transform[4]<x-2&&i.transform[4]+(i.width||0)>x+2).length;if(!best||cross<best.cross)best={x,cross}}
  const X=i=>i.transform[4]<best.x-2&&i.transform[4]+(i.width||0)>best.x+2,full=its.filter(X),col=its.filter(i=>!X(i)),lc=col.filter(i=>i.transform[4]<best.x),rc=col.filter(i=>i.transform[4]>=best.x);
  if(best.cross<=its.length*.03&&lc.length>=its.length*.2&&rc.length>=its.length*.2){p._cols=2;const top=Math.max(...col.map(i=>i.transform[5]));
   return [...lines(full.filter(i=>i.transform[5]>top)),...lines(lc),...lines(rc),...lines(full.filter(i=>i.transform[5]<=top))].join('\n')}}
 return lines(its).join('\n')}
async function renderPage(p,scale){const v=p.getViewport({scale}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;return c}

/* ========== HOJAS DE RESPUESTAS DE LECTURA ÓPTICA (casillas rellenas) ==========
   Busca recuadros rellenos de negro, los ordena en filas y columnas y deduce la letra por su posición.
   Numeración: por columnas, de arriba abajo (1-20 en la primera columna, 21-40 en la segunda…). */
function omrDetect(cv){
 const W=cv.width,H=cv.height,N=W*H,d=cv.getContext('2d').getImageData(0,0,W,H).data,g=new Uint8Array(N),hist=new Uint32Array(256);
 for(let i=0,j=0;j<N;i+=4,j++){const a=d[i+3]/255,v=((d[i]*299+d[i+1]*587+d[i+2]*114)/1000)*a+255*(1-a)|0;g[j]=v;hist[v]++}
 // umbral de Otsu (con tope para no confundir grises claros con relleno)
 let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sB=0,wB=0,best=0,th=110;
 for(let i=0;i<256;i++){wB+=hist[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*hist[i];const mB=sB/wB,mF=(sum-sB)/wF,b=wB*wF*(mB-mF)*(mB-mF);if(b>best){best=b;th=i}}
 th=Math.min(th,140);
 const lab=new Uint8Array(N),st=new Int32Array(N),comps=[];
 for(let p=0;p<N;p++){if(lab[p]||g[p]>=th)continue;let top=0,n=0,x0=W,x1=0,y0=H,y1=0;st[top++]=p;lab[p]=1;
  while(top){const q=st[--top],x=q%W,y=(q-x)/W;n++;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
   if(x>0&&!lab[q-1]&&g[q-1]<th){lab[q-1]=1;st[top++]=q-1}if(x<W-1&&!lab[q+1]&&g[q+1]<th){lab[q+1]=1;st[top++]=q+1}
   if(y>0&&!lab[q-W]&&g[q-W]<th){lab[q-W]=1;st[top++]=q-W}if(y<H-1&&!lab[q+W]&&g[q+W]<th){lab[q+W]=1;st[top++]=q+W}}
  const w=x1-x0+1,h=y1-y0+1;
  if(w<W*.01||w>W*.07||h<2)continue;
  // casilla rellena = franja de varias líneas seguidas casi totalmente negras (las vacías solo tienen un borde fino; las letras, ninguna)
  let run=0,bestRun=0,bestEnd=0,ink=0;
  for(let y=y0;y<=y1;y++){let k=0;for(let x=x0;x<=x1;x++)if(g[y*W+x]<th)k++;if(k>=w*.8){run++;ink+=k;if(run>bestRun){bestRun=run;bestEnd=y}}else run=0}
  if(bestRun>=Math.max(3,w*.25))comps.push({x:(x0+x1)/2,y:bestEnd-(bestRun-1)/2,w,h:bestRun,n:bestRun*w})}
 if(comps.length<10)return null;
 const med=a=>{const s=[...a].sort((x,y)=>x-y);return s[s.length>>1]};
 const mw=med(comps.map(c=>c.w)),mh=med(comps.map(c=>c.h));
 const ok=comps.filter(c=>c.w>mw*.6&&c.w<mw*1.6&&c.h>mh*.4&&c.h<mh*2.2);
 if(ok.length<10)return null;
 // agrupa valores 1D: un grupo nuevo cuando el salto supera «gap»
 const groupsN=(vals,gap)=>{const s=[...vals].sort((a,b)=>a-b),out=[];let cur=[s[0]];
  for(let i=1;i<s.length;i++){if(s[i]-s[i-1]>gap){out.push(cur);cur=[]}cur.push(s[i])}out.push(cur);return out.map(c=>({x:c.reduce((a,b)=>a+b,0)/c.length,n:c.length}))};
 const rows=groupsN(ok.map(c=>c.y),Math.max(mh*1.5,4)).map(g=>g.x),slotsN=groupsN(ok.map(c=>c.x),mw*.6),slots=slotsN.map(g=>g.x);
 if(rows.length<3||slots.length<2)return null;
 // separación entre casillas de una misma pregunta y corte de columnas
 // las casillas de una pregunta están a distancias regulares; un salto mayor separa columnas, y los grupos de una sola posición (números de pregunta en negrita, manchas) se descartan
 const gaps=slots.slice(1).map((x,i)=>x-slots[i]),sp=med(gaps.filter(v=>v<mw*2.4))||mw*1.3;let cols=[[slotsN[0]]];
 for(let i=1;i<slotsN.length;i++){if(slots[i]-slots[i-1]>sp*1.35)cols.push([]);cols[cols.length-1].push(slotsN[i])}
 // en cada columna, la serie más larga de posiciones a distancia regular (±20 %): así se descartan números y flechas junto a la casilla A
 cols=cols.map(c=>{let best=[];for(let i=0;i<c.length;i++){const run=[c[i]];for(let j=i+1;j<c.length&&Math.abs(c[j].x-run[run.length-1].x-sp)<=sp*.2;j++)run.push(c[j]);if(run.length>best.length)best=run}return best}).filter(c=>c.length>=2);
 if(!cols.length)return null;
 // con 5 posiciones, si la de un extremo tiene muchas menos marcas que las demás, es ruido y se quita
 const mn=med(cols.flat().map(s=>s.n));
 cols=cols.map(c=>{if(c.length<5)return c;const e=c[0].n<=c[c.length-1].n?0:c.length-1;return c[e].n<mn*.5?c.filter((_,i)=>i!==e):c}).map(c=>c.slice(-5).map(s=>s.x));
 // posición de la casilla A en cada columna: de las columnas completas; en las incompletas, por interpolación
 const nOpt=Math.max(...cols.map(c=>c.length)),full=cols.map((c,i)=>c.length===nOpt?[i,c[0]]:null).filter(Boolean);
 let a0,bk;if(full.length>=2){const[i1,x1]=full[0],[i2,x2]=full[full.length-1];bk=(x2-x1)/(i2-i1);a0=x1-bk*i1}else{a0=cols[0][0];bk=cols.length>1?(cols[cols.length-1][0]-cols[0][0])/(cols.length-1):0}
 const colStart=cols.map((c,i)=>c.length===nOpt?c[0]:a0+bk*i);
 const cell={};
 for(const c of ok){const r=rows.reduce((b,y,i)=>Math.abs(y-c.y)<Math.abs(rows[b]-c.y)?i:b,0);
  let k=-1;for(let i=0;i<cols.length;i++)if(c.x>=colStart[i]-sp*.5&&c.x<=colStart[i]+sp*(nOpt-.5))k=i;if(k<0)continue;
  const L=Math.round((c.x-colStart[k])/sp)|0;if(L<0||L>=nOpt)continue;
  const key=k*rows.length+r+1;(cell[key]=cell[key]||[]).push({L,n:c.n})}
 const pairs={},dudosas=[];
 for(const key in cell){const a=cell[key].sort((x,y)=>y.n-x.n);if(a.length>1&&a[1].n>=a[0].n*.75&&a[1].L!==a[0].L){dudosas.push(+key);continue}pairs[key]=a[0].L}
 // segunda pasada: en las preguntas sin leer, mide la tinta dentro de cada casilla en su posición exacta de la rejilla
 const dark=(cx,cy)=>{const hw=Math.max(2,mw*.35)|0,hh=Math.max(1,mh*.35)|0;let k=0,t=0;
  for(let y=Math.round(cy)-hh;y<=Math.round(cy)+hh;y++)for(let x=Math.round(cx)-hw;x<=Math.round(cx)+hw;x++){if(x<0||y<0||x>=W||y>=H)continue;t++;if(g[y*W+x]<th)k++}return t?k/t:0};
 for(let k=0;k<cols.length;k++)for(let r=0;r<rows.length;r++){const key=k*rows.length+r+1;if(pairs[key]!==undefined||dudosas.includes(key))continue;
  const v=Array.from({length:nOpt},(_,L)=>dark(colStart[k]+L*sp,rows[r])),mx=Math.max(...v),i=v.indexOf(mx),sec=Math.max(0,...v.filter((_,j)=>j!==i));
  if(mx>=.7&&sec<=.35)pairs[key]=i}
 const filled=Object.keys(pairs).length;
 if(filled<Math.max(5,rows.length*cols.length*.4))return null;
 return{pairs,dudosas,filas:rows.length,columnas:cols.length,opciones:nOpt}}

/* ========== NORMATIVA: referencia legal de cada pregunta ========== */
const RLEY=/\b(Ley(?:\s+Org[áa]nica)?|Real\s+Decreto(?:\s+Legislativo|-ley)?|Decreto(?:\s+Legislativo)?|Orden|Directiva|Reglamento(?:\s*\((?:UE|CE)\))?)\s+(?:n[ºo°.]\s*)?((?:[A-Z]{2,4}\/)?\d{1,4}\/\d{2,4})/i;
function extractLey(q){const t=q.text+' '+q.opts.join(' '),m=RLEY.exec(t);let s='';
 if(m){s=m[1].replace(/\s+/g,' ')+' '+m[2];s=s[0].toUpperCase()+s.slice(1)}else if(/constituci[oó]n espa[ñn]ola/i.test(t))s='Constitución Española';
 const a=/\bart(?:[íi]culo|\.)\s*(\d+(?:\.\d+)?)/i.exec(t);return s?s+(a?', art. '+a[1]:''):''}
const leyBase=s=>(s||'').split(',')[0].trim();
const hasNorma=q=>!!(q.ley||/\b(ley|real decreto|decreto|orden ministerial|reglamento|directiva|constituci[oó]n|art[íi]culo|art\.\s*\d)/i.test(q.text+' '+q.opts.join(' ')));
const EXM=m=>m==='examen'||m==='simulacro';

/* ========== PARSER ========== */
const MK='\\[\\s*[xX✔✓☒✗]\\s*\\]|\\(\\s*[xX]\\s*\\)|[xX]\\)|[✔✓☒]|[xX](?=\\s+\\(?[a-eA-E]\\s*[.)\\-–])';
const RO=new RegExp('^(?:('+MK+')\\s*)?\\(?([a-eA-E])\\s*[.)\\-–]\\s*(.*)$'),RM=new RegExp('^('+MK+')\\s*'),RQ=/^(\d{1,3})\s*[.)\-–]\s*(.+)/;
const RSOL=/^(respuestas?( correctas)?|hoja de respuestas|soluciones|soluci[oó]n|plantilla|clave)\b/i, RPN=/^(p[aá]g(ina)?\.?\s*)?\d+(\s*(de|\/)\s*\d+)?$/i;
function solPairs(txt){const m={},r=/(\d{1,3})\s*[.\-–:)]*\s*([a-eA-E])(?![a-zA-Záéíóúñ])/g;let x;while(x=r.exec(txt))m[+x[1]]=L.indexOf(x[2].toUpperCase());return m}
/* lines:[{t,p,ocr}] → preguntas. Ignora cabeceras repetidas y números de página. */
function parse(lines,file){
 const cnt={};lines.forEach(l=>{(cnt[l.t]=cnt[l.t]||new Set()).add(l.p)});const np=new Set(lines.map(l=>l.p)).size;
 const all=lines.map(l=>l.t).join(' ');
 lines=lines.filter(l=>!RPN.test(l.t)&&!(np>=3&&cnt[l.t].size>=np*0.5));
 const qs=[];let cur=null,last=0,sol=null,g=0,gi=0,yr=(/\b(?:19|20)\d\d\b/.exec(file||'')||[''])[0]; // g = inicio del examen actual (un PDF puede traer varios)
 let pend='';const apply=()=>{const st=(pend+' '+(sol||'')).trim();if(st){const sp=solPairs(st);qs.slice(g).forEach(q=>{if(q.ans<0&&sp[q.num]!=null){q.ans=sp[q.num];q.ocr=false}})}sol=null;pend='';g=qs.length;gi++};
 for(const l of lines){const t=l.t,m0=RQ.exec(t);
  if(!m0&&t.length<130&&/examen|convocatoria|proceso selectivo|ejercicio/i.test(t)){const y=/\b(?:19|20)\d\d\b/.exec(t);if(y)yr=y[0]}
  if(sol!==null){ // dentro de una plantilla: «1.» con enunciado = otro examen; la pregunta siguiente de la numeración = la plantilla estaba en medio (p. ej. al pie de la columna izquierda)
   const isQ=m0&&m0[2].length>=20&&!/^[a-eA-E]\s*([\d.\-–,;]|$)/.test(m0[2]);
   if(isQ&&m0[1]==='1'&&last>1){apply();cur=null;last=0}else if(isQ&&+m0[1]===last+1){pend+=' '+sol;sol=null}else{sol+=' '+t;continue}}
  if(RSOL.test(t)&&cur){sol=t;continue}
  let m;
  if(cur&&(m=RO.exec(t))&&L.indexOf(m[2].toUpperCase())===cur.opts.length){
   let txt=m[3],mark=!!m[1];const m2=RM.exec(txt);if(m2){mark=true;txt=txt.slice(m2[0].length)}
   cur.opts.push(txt);if(mark){cur.ans=cur.opts.length-1;cur.x=true;if(l.ocr)cur.ocr=true}continue}
  if(m0&&(!cur||cur.opts.length>=2||+m0[1]===last+1)){if(+m0[1]===1&&last>1){g=qs.length;gi++}last=+m0[1];cur={num:last,text:m0[2],opts:[],ans:-1,page:l.p,ocr:!!l.ocr,file,anio:yr,grp:gi};qs.push(cur);continue}
  if(cur){if(cur.opts.length)cur.opts[cur.opts.length-1]+=' '+t;else cur.text+=' '+t}}
 apply();
 return {qs:qs.filter(q=>q.opts.length>=2),solOnly:!qs.length,solAll:solPairs(all)}}
function finalize(q){q.id=uid();q.hash=hash(q.text);q.date=Date.now();q.topic=q.topic||'';q.text=q.text.trim();q.opts=q.opts.map(o=>o.trim());
 q.status=q.ans<0?'sin respuesta':(q.ocr&&q.x?'dudosa':'confirmada');q.ley=extractLey(q);q.veces=1;q.anios=q.anio?[q.anio]:[];q.vistas=0;q.aciertos=0;return q}

/* ========== IMPORTADOR ========== */
const R={qs:[],pdfs:{},filter:'todas'};let LIST=[];
/* Los PDFs se guardan en el almacén «pdfs»: no hay que volver a subirlos al actualizar la aplicación. */
async function importFiles(files){
 if(!window.pdfjsLib){toast('PDF.js no se ha cargado: comprueba tu conexión a internet.');return}
 files=[...files].filter(f=>/\.pdf$/i.test(f.name)).slice(0,20);if(!files.length)return;
 const have=new Map((await DB.all('pdfs')).map(p=>[p.name,p])),jobs=[];
 for(const f of files){const ex=have.get(f.name);
  if(ex&&ex.size===f.size){toast(f.name+' ya estaba guardado. Usa «Reprocesar» en Mis PDFs para releerlo.');continue}
  await DB.put('pdfdata',{name:f.name,data:await f.arrayBuffer()});await DB.put('pdfs',{name:f.name,size:f.size,date:Date.now(),nq:0,info:''});jobs.push(f.name)}
 await processPdfs(jobs)}
/* Informe de calidad: números de pregunta que faltan (un reinicio de numeración = otro examen) */
function report(qs){const miss=[];let p=0;qs.forEach(q=>{if(p>0&&q.num>p+1)for(let k=p+1;k<q.num;k++)miss.push(k);p=q.num});
 return (miss.length?'⚠ Faltan números: '+miss.slice(0,25).join(', ')+(miss.length>25?'…':''):'Numeración correcta')+` · ${qs.filter(q=>q.ans<0).length} sin respuesta`}
async function processPdfs(names){
 if(!window.pdfjsLib){toast('PDF.js no se ha cargado: comprueba tu conexión a internet.');return}
 if(!names.length){viewLib();return}await pdfWorker();
 $('queue').innerHTML=names.map((n,i)=>`<div class="box"><b>${E(n)}</b> <span class="tag" id="st${i}">En cola</span><br><progress id="pr${i}" value="0" max="1" style="width:100%"></progress><div class="mu" id="lg${i}"></div><div id="rp${i}"></div></div>`).join('');
 const sum=[],bm=await bankMap();
 for(let i=0;i<names.length;i++){const name=names[i],st=$('st'+i),pr=$('pr'+i),lg=$('lg'+i);
  try{const rec=await DB.get('pdfs',name),dat=await DB.get('pdfdata',name);st.textContent='Leyendo…';
   const pdf=await pdfjsLib.getDocument({data:dat.data.slice(0)}).promise;R.pdfs[name]=pdf;
   const lines=[],meth=[];
   for(let p=1;p<=pdf.numPages;p++){const pg=await pdf.getPage(p);let txt=await pageText(pg),ocr=false;
    const grid=(txt.match(/\b\d{1,3}\s*[A-E]\s+[A-E]\s+[A-E]\b/g)||[]).length>=5; // hoja de respuestas con capa de texto «1 A B C D…»: el texto no dice cuál está marcada
    if(grid||txt.replace(/\s/g,'').length<15){st.textContent=`Analizando página ${p}/${pdf.numPages}…`;const cv=await renderPage(pg,2.5),om=omrDetect(cv);
     if(om){const ks=Object.keys(om.pairs).map(Number).sort((a,b)=>a-b),pl=['HOJA DE RESPUESTAS'];for(let k=0;k<ks.length;k+=10)pl.push(ks.slice(k,k+10).map(n=>n+'-'+L[om.pairs[n]]).join(' '));
      meth.push(`${p}:hoja de respuestas (${ks.length} leídas${om.dudosas.length?', dudosas: '+om.dudosas.join(', '):''})`);lg.textContent='Métodos por página → '+meth.join(' · ');
      pl.forEach(t=>lines.push({t,p,ocr:false}));pr.value=p/pdf.numPages;continue}
     if(grid){meth.push(p+':hoja de respuestas sin marcas legibles');lg.textContent='Métodos por página → '+meth.join(' · ');pr.value=p/pdf.numPages;continue}
     ocr=true;if(!window.Tesseract){meth.push(p+':sin OCR');toast('Tesseract.js no se ha cargado: las páginas escaneadas no se pueden leer.');pr.value=p/pdf.numPages;continue}
     st.textContent=`OCR página ${p}/${pdf.numPages}…`;txt=await ocrCanvas(cv)}
    meth.push(`${p}:${ocr?'OCR':pg._cols?'texto 2 col.':'texto'}`);lg.textContent='Métodos por página → '+meth.join(' · ');
    txt.split('\n').map(x=>x.trim()).filter(Boolean).forEach(t=>lines.push({t,p,ocr}));pr.value=p/pdf.numPages}
   const r=parse(lines,name),sgs=parseSolutions(lines,name),np=sgs.reduce((a,g)=>a+Object.keys(g.pairs).length,0);let rp='';
   if((r.qs.length===0&&np>=3)||(r.qs.length<3&&np>=5)){rec.tipo='respuestas';rec.solGroups=sgs;rec.nq=0;rp=`Archivo de respuestas: ${np} respuestas en ${sgs.length} examen(es)`;st.textContent='Listo · solo respuestas';sum.push(name+': '+rp)}
   else{r.qs.forEach(finalize);const a=await autoAdd(r.qs,bm);rec.tipo='preguntas';rec.nq=r.qs.length;rp=report(r.qs);st.textContent=`Listo · ${r.qs.length} preguntas guardadas en el banco`;
    sum.push(`${name}: ${a.add} nuevas · ${a.merged} ya vistas en otro examen (suman una aparición) · ${a.skipped} ya existían`)}
   $('rp'+i).textContent=rp;rec.info=rp;await DB.put('pdfs',rec)
  }catch(e){console.error(e);st.textContent='Error: '+(e.message||e)+' — revisa la conexión a internet y recarga la página.'}}
 showLink(await linkAnswers(),sum);viewLib()}
async function viewLib(){const el=$('lib');if(!el)return;const l=await DB.all('pdfs');
 el.innerHTML=l.length?`<h2>Mis PDFs guardados (${l.length})</h2><div class="row"><button data-act="relink">Relacionar respuestas ahora</button></div><div style="overflow:auto"><table><tr><th>Archivo</th><th>Tipo</th><th>MB</th><th>Preguntas</th><th>Informe y relación</th><th></th></tr>${l.map(p=>`<tr><td>${E(p.name)}</td><td>${p.tipo==='respuestas'?'Respuestas':'Preguntas'}</td><td>${(p.size/1e6).toFixed(1)}</td><td>${p.nq}</td><td class="mu">${E(p.info||'')}${p.vinculo?'<br>🔗 '+E(p.vinculo):''}</td><td><button data-act="reproc" data-n="${E(p.name)}">Reprocesar</button> <button class="dg" data-act="pdel" data-n="${E(p.name)}">Quitar</button></td></tr>`).join('')}</table></div><p class="mu">Se guardan en este navegador: no hace falta subirlos otra vez al actualizar la aplicación.</p>`:''}
function renderReview(){
 const f=R.filter;LIST=R.qs.filter(q=>f==='todas'||(f==='dudosas'&&q.status==='dudosa')||(f==='sin respuesta'&&q.status==='sin respuesta')||(f==='duplicadas'&&q.dup));
 $('review').innerHTML=R.qs.length?`<h2>Revisión (${R.qs.length} pendientes)</h2><div class="row"><select id="rf" data-act="rfilter">${['todas','dudosas','sin respuesta','duplicadas'].map(o=>`<option ${o===f?'selected':''}>${o}</option>`).join('')}</select><button class="pr" data-act="appall">Aprobar todas las confiables</button><span class="mu">Solo las aprobadas pasan al banco.</span></div><div class="split"><div>${LIST.map((q,i)=>card(q,i,'r')).join('')||'<p class="mu">Nada con este filtro.</p>'}</div><div id="pg" class="box mu">Pulsa «Ver pág.» para comparar con la página original.</div></div>`:''}
function card(q,i,m){return `<div class="card ${q.status==='confirmada'?'c1':q.status==='dudosa'?'c2':'c3'}" data-i="${i}"><div class="row"><b>${q.num?'#'+q.num+' · ':''}${E(q.file||'')} p.${q.page||'-'}</b><span class="tag">${q.status}${q.dup?' · posible duplicada':''}${q.ocr?' · OCR':''}${q.anio?' · '+q.anio:''}${q.veces>1?' · repetida ×'+q.veces:''}${q.conflicto?' · ⚠ no coincide con la plantilla':''}${q.desfasada?' · ⚠ posiblemente desfasada':''}</span></div>
<textarea data-f="text" rows="3">${E(q.text)}</textarea>${q.opts.map((o,k)=>`<div class="row"><b>${L[k]}</b><input data-f="opt" data-o="${k}" value="${E(o)}"></div>`).join('')}
<div class="row"><select data-f="ans"><option value="-1">Sin respuesta</option>${q.opts.map((o,k)=>`<option value="${k}" ${q.ans===k?'selected':''}>Correcta: ${L[k]}</option>`).join('')}</select><input data-f="topic" placeholder="Tema / bloque" value="${E(q.topic||'')}"></div><div class="row"><input data-f="ley" placeholder="Referencia legal (p. ej. Ley 16/1985, art. 40)" value="${E(q.ley||'')}"></div><div class="row"><input data-f="nota" placeholder="Explicación (opcional)" value="${E(q.nota||'')}"><label class="tag"><input type="checkbox" data-f="excl" ${q.excl?'checked':''}> Anulada / excluir de tests</label></div>
<div class="row"><button class="pr" data-act="${m}ok" data-i="${i}">${m==='r'?'Aprobar':'Guardar'}</button><button data-act="page" data-i="${i}">Ver pág.</button>${m==='b'&&hasNorma(q)?`<button data-act="iaone" data-i="${i}">Revisar normativa con IA</button>`:''}<button class="dg" data-act="${m}del" data-i="${i}">Eliminar</button></div>${iaBlock(q,i)}</div>`}
async function approve(q){const b=await DB.all('preguntas'),ex=b.find(x=>x.hash===q.hash&&x.id!==q.id);
 if(ex){if(!confirm('Esta pregunta ya existe en el banco.\nAceptar = fusionar (cuenta una aparición más y actualiza la respuesta)\nCancelar = omitir'))return false;
  if(ex.file!==q.file){ex.veces=(ex.veces||1)+1;ex.anios=[...new Set([...(ex.anios||[ex.anio]),q.anio].filter(Boolean))]}
  if(q.ans>=0&&q.status==='confirmada'){ex.ans=q.ans;ex.status='confirmada'}await DB.put('preguntas',ex);return true}
 delete q.dup;await DB.put('preguntas',q);return true}

/* ========== BANCO ========== */
const BK={q:'',topic:'',file:'',status:'',ley:'',ia:''};
async function viewBank(){const all=await DB.all('preguntas'),T=[...new Set(all.map(q=>q.topic).filter(Boolean))],F=[...new Set(all.map(q=>q.file).filter(Boolean))];
 const s=BK.q.toLowerCase(),Ls=[...new Set(all.map(q=>leyBase(q.ley)).filter(Boolean))].sort(),iaF={'Con normativa':q=>hasNorma(q),'Normativa sin revisar':q=>hasNorma(q)&&!q.ia,'IA: desfasada':q=>q.desfasada,'IA: vigente':q=>q.ia&&q.ia.estado==='vigente','IA: dudosa':q=>q.ia&&q.ia.estado==='dudosa','IA: otra respuesta':q=>q.ia&&q.ia.letra>=0&&q.ia.letra!==q.ans};
 LIST=all.filter(q=>(!s||q.text.toLowerCase().includes(s)||(q.ley||'').toLowerCase().includes(s))&&(!BK.topic||q.topic===BK.topic)&&(!BK.file||q.file===BK.file)&&(!BK.status||q.status===BK.status)&&(!BK.ley||leyBase(q.ley)===BK.ley)&&(!BK.ia||iaF[BK.ia](q)));
 const nN=all.filter(hasNorma).length,nP=all.filter(q=>hasNorma(q)&&!q.ia).length,nD=all.filter(q=>q.desfasada).length;
 const opt=(a,v,t='Todos')=>`<option value="">${t}</option>`+a.map(x=>`<option ${x===v?'selected':''}>${E(x)}</option>`).join('');

const inScope=(q,v)=>!v||(v[0]==='t'?q.topic===v.slice(2):v[0]==='f'?q.file===v.slice(2):v[0]==='y'?q.anio===v.slice(2):v[0]==='r'?(q.veces||1)>1:v[0]==='n'?!q.vistas:v[0]==='w'?q.vistas>0:v[0]==='l'?leyBase(q.ley)===v.slice(2):v[0]==='d'?!!q.desfasada:true);
let T=null,VIEW='importar';
const penOpts=(v)=>[[0,'Sin penalización'],[0.25,'1/4'],[1/3,'1/3'],[0.5,'1/2']].map(([x,n])=>`<option value="${x}" ${Math.abs(x-v)<.001?'selected':''}>${n}</option>`).join('');
async function cfgHTML(src){let sc='',th='';

 if(src==='banco')th=`<div class="row"><label style="flex:1;min-width:240px"><b>Test temático</b> (opcional) · escribe temas separados por comas<input id="tK" placeholder="arqueología medieval, Alhambra, conservación y restauración"></label></div><div class="row"><label><input type="checkbox" id="tL"> Búsqueda amplia (basta con la mitad de las palabras de cada tema)</label><button data-act="tprev">Ver coincidencias</button></div><div id="tPrev"></div><hr style="border:0;border-top:1px solid var(--bd)">`;
 return `<div class="box">${th}<div class="row">${sc}<label>Nº preguntas (25–100) <input id="tN" type="number" min="25" max="100" value="50" style="width:80px"></label><label>Modo <select id="tM"><option value="estudio">Estudio</option><option value="examen">Examen</option><option value="rapido">Repaso rápido</option>${src==='banco'?`<option value="simulacro">🔒 Simulacro oficial (${CFG.simN} preg. · ${CFG.simMin} min)</option>`:''}</select></label></div>
<div class="row"><label>Acierto + <input id="tA" type="number" step="0.1" min="0" value="${CFG.acierto}" style="width:70px"></label><label>Fallo − <input id="tF" type="number" step="0.1" min="0" value="${CFG.fallo}" style="width:70px"></label><label>Límite (min, 0=sin) <input id="tT" type="number" min="0" value="0" style="width:80px"></label><label><input type="checkbox" id="tR" checked> Orden aleatorio (preguntas y opciones)</label>${src==='banco'?'<label><input type="checkbox" id="tO"> Orden original (simulacro de examen)</label>':''}</div>
<button class="pr" data-act="start" data-src="${src}">Empezar test</button></div>`}
async function startTest(src){
 if(await DB.get('config','run')&&!confirm('Tienes un test a medias. Si empiezas otro, se descartará. ¿Continuar?'))return;
 let pool;if(src==='errores'){const e=(await DB.all('errores')).filter(x=>!x.out);
  e.sort((a,b)=>a.box-b.box||(a.lastRev||a.last)-(b.lastRev||b.last)||b.fails-a.fails); // Leitner: cajas bajas y más antiguas primero
  const bank=Object.fromEntries((await DB.all('preguntas')).map(q=>[q.id,q]));pool=e.map(x=>bank[x.id]||x.q)}
 else{const s=$('tS').value;pool=(await DB.all('preguntas')).filter(q=>inScope(q,s))}
 pool=pool.filter(q=>q.ans>=0&&q.opts.length>=2&&!q.excl&&(CFG.incluirDesf||!q.desfasada));if(!pool.length){toast('No hay preguntas con respuesta para este test.');return}
 const mode=$('tM').value,sh=$('tR').checked||mode==='simulacro',n=mode==='simulacro'?Math.max(1,+CFG.simN||100):Math.min(100,Math.max(25,+$('tN').value||50)),kw=src==='banco'&&$('tK').value.trim(),sv=src==='banco'?$('tS').value:'',orig=src==='banco'&&$('tO').checked;
 if(sv[0]==='w')pool=pool.filter(q=>q.vistas>0).sort((a,b)=>(a.aciertos||0)/a.vistas-(b.aciertos||0)/b.vistas).slice(0,n);if(sv[0]==='r')pool=pool.sort((a,b)=>(b.veces||1)-(a.veces||1)).slice(0,n);
 if(kw){const r=themedPick(pool,kw,$('tL').checked,n);if(!r.picked.length){toast('Ninguna pregunta con respuesta encaja con esos temas. Prueba «Ver coincidencias» o la búsqueda amplia.');return}pool=r.picked;if(r.picked.length<n)toast('Solo hay '+r.picked.length+' preguntas que encajen con esos temas.')}
 if(orig)pool.sort((a,b)=>(a.file||'').localeCompare(b.file||'')||(a.num||0)-(b.num||0));else if(src!=='errores'||sh)pool=shuffle(pool);
 const ac=isNaN(+$('tA').value)?1.2:+$('tA').value,fa=Math.abs(isNaN(+$('tF').value)?0.4:+$('tF').value),label=kw||(src==='errores'?'Banco de errores':sv?$('tS').selectedOptions[0].text:'Todo el banco');CFG.acierto=ac;CFG.fallo=fa;saveCfg();
 const items=pool.slice(0,mode==='rapido'?Math.min(n,10):n).map(q=>{let o=q.opts.map((t,i)=>({t,i}));if(sh&&!orig)o=shuffle(o);return{q,o,cor:o.findIndex(x=>x.i===q.ans),sel:-1,flag:false,time:0}});
 T={items,cur:0,mode,ac,fa,label:(mode==='simulacro'?'Simulacro · ':'')+label,lim:mode==='simulacro'?(+CFG.simMin||90)*60:(+$('tT').value||0)*60,t0:Date.now(),start:Date.now(),run:true,src};

/* Test a medias: se guarda en cada respuesta y cada 15 s; al reabrir la aplicación se puede continuar */
function saveRun(){if(!T||!T.run)return;const x={...T,iv:null,el:(Date.now()-T.start)/1000};DB.put('config',{k:'run',T:x}).catch(()=>{})}

window.addEventListener('beforeunload',()=>{if(T&&T.run){leave();saveRun()}});
function tickClock(){const c=$('clk');if(!c||!T)return;const s=Math.floor((Date.now()-T.start)/1000),r=T.lim?T.lim-s:s;c.textContent=(T.lim?'Quedan ':'')+Math.floor(Math.max(r,0)/60)+':'+String(Math.max(r,0)%60).padStart(2,'0');if(T.lim&&r<=0&&T.run)finish();else if(s%15===0)saveRun()}
function leave(){if(T){T.items[T.cur].time+=Date.now()-T.t0;T.t0=Date.now()}}
function goQ(k){leave();T.cur=Math.max(0,Math.min(T.items.length-1,k));T.summary=false;showQ()}
function answer(k){const it=T.items[T.cur];if(k>=it.o.length)return;if(!EXM(T.mode)&&it.sel>=0)return;it.sel=k;showQ();if(T.mode==='rapido')setTimeout(()=>{if(T&&T.run&&T.cur<T.items.length-1)goQ(T.cur+1)},900)}
function showQ(){const it=T.items[T.cur],rev=!EXM(T.mode)&&it.sel>=0,n=T.items.length;saveRun();
 $('main').innerHTML=`<div class="row"><b>Pregunta ${T.cur+1}/${n}</b><span class="tag">${T.mode==='simulacro'?'🔒 Simulacro · sin correcciones hasta entregar':E(T.mode)} · +${f2(T.ac)} / −${f2(T.fa)}${CFG.corte?' · objetivo '+f2(CFG.corte):''}</span><span id="clk" class="tag"></span><button data-act="flag">${it.flag?'★ Marcada':'☆ Marcar'}</button><button data-act="summary">Resumen / Entregar</button></div>
 <div class="grid">${T.items.map((x,i)=>`<button data-act="goq" data-i="${i}" class="${x.sel>=0?'an':''} ${x.flag?'fl':''} ${i===T.cur?'cu':''}">${i+1}</button>`).join('')}</div>
 <div class="box" style="margin-top:12px"><p>${E(it.q.text)}</p>${it.o.map((x,k)=>`<button class="opt ${rev?(k===it.cor?'ok':k===it.sel?'ko':''):(k===it.sel?'sel':'')}" data-act="ans" data-i="${k}"><b>${L[k]})</b> ${E(x.t)}</button>`).join('')}
 ${rev&&it.q.nota?`<p class="mu">📝 ${E(it.q.nota)}</p>`:''}<div class="row"><button data-act="blank">Dejar en blanco</button><button data-act="prev">← Anterior</button><button class="pr" data-act="next">Siguiente →</button></div><p class="tag">Atajos: A–E responder · Enter siguiente · ←/→ navegar</p></div>`;tickClock()}
function summary(){leave();T.summary=true;saveRun();const a=T.items.filter(i=>i.sel>=0).length,f=T.items.map((x,i)=>x.flag?i+1:null).filter(Boolean);
 $('main').innerHTML=`<h2>Resumen</h2><div class="box">Contestadas: ${a} · En blanco: ${T.items.length-a} · Marcadas: ${f.join(', ')||'ninguna'}<div class="row"><button data-act="goq" data-i="${T.cur}">Volver</button><button class="pr" data-act="finish">Entregar test</button><button class="dg" data-act="abandon">Abandonar sin guardar</button></div></div>`}
async function passQ(q){const e=await DB.get('errores',q.id);if(!e||e.out)return;e.streak++;e.box=Math.min(5,e.box+1);e.lastRev=Date.now();if(e.streak>=CFG.exitN)e.out=true;await DB.put('errores',e)}
async function failQ(q){const e=(await DB.get('errores',q.id))||{id:q.id,fails:0};Object.assign(e,{q,fails:e.fails+1,streak:0,box:1,last:Date.now(),out:false});await DB.put('errores',e)}
async function finish(){if(!T||!T.run)return;leave();T.run=false;clearInterval(T.iv);await DB.del('config','run');let ok=0,ko=0,bl=0;const det=[];
 for(const it of T.items){const q=it.q,d={id:q.id,topic:q.topic||'',file:q.file||''};
  if(it.sel<0){bl++;d.ok=null;if(CFG.blankErr)await failQ(q)}else if(it.sel===it.cor){ok++;d.ok=1;await passQ(q)}else{ko++;d.ok=0;await failQ(q)}if(it.sel>=0){const bq=await DB.get('preguntas',q.id);if(bq){bq.vistas=(bq.vistas||0)+1;if(d.ok)bq.aciertos=(bq.aciertos||0)+1;bq.upd=Date.now();await DB.put('preguntas',bq)}}det.push(d)}
 const n=T.items.length,pts=ok*T.ac-ko*T.fa,max=n*T.ac,h={date:Date.now(),mode:T.mode,src:T.src,label:T.label,ok,ko,blank:bl,n,pts,max,ac:T.ac,fa:T.fa,nota:Math.max(0,pts)/max*10,notaSin:ok/n*10,dur:(Date.now()-T.start)/1000,corte:+CFG.corte||0,avgT:T.items.reduce((s,i)=>s+i.time,0)/n/1000,det};
 await DB.put('historial',h);CFG.sessions++;await saveCfg();T.res=h;viewResult();syncFile(false)}

 ${T.items.map((it,i)=>{const good=it.sel===it.cor;return `<div class="card ${it.sel<0?'c2':good?'c1':'c3'}"><b>${i+1}.</b> ${E(it.q.text)}<br><span class="mu">Tu respuesta: ${it.sel<0?'en blanco':E(it.o[it.sel].t)}<br>Correcta: ${E(it.o[it.cor].t)}</span><div class="row"><button data-act="fix" data-i="${i}">Reportar / corregir respuesta</button></div></div>`}).join('')}`}

 it.q.ans=k;it.q.status='confirmada';it.q.src='manual';it.q.upd=Date.now();await DB.put('preguntas',it.q);const e=await DB.get('errores',it.q.id);if(e){e.q=it.q;await DB.put('errores',e)}toast('Respuesta corregida en el banco');it.cor=it.o.findIndex(x=>x.i===k);viewResult()}

 const agg=(f,none)=>{const m={};h.forEach(x=>x.det.forEach(d=>{if(d.ok===null)return;const t=f(pm[d.id]||d)||none;m[t]=m[t]||[0,0];m[t][0]+=d.ok;m[t][1]++}));return Object.entries(m).sort((x,y)=>x[1][0]/x[1][1]-y[1][0]/y[1][1]).map(([t,[a,b]])=>`<tr><td>${E(t)}</td><td>${(a/b*100).toFixed(0)}%</td><td>${a}/${b}</td></tr>`).join('')||'<tr><td class="mu">Sin datos</td></tr>'};
 const days=new Set(h.map(x=>new Date(x.date).toDateString()));let streak=0,d=new Date();if(!days.has(d.toDateString()))d.setDate(d.getDate()-1);while(days.has(d.toDateString())){streak++;d.setDate(d.getDate()-1)}

 <div class="box"><b>Más falladas</b><table>${er.sort((a,b)=>b.fails-a.fails).slice(0,10).map(x=>`<tr><td>${E(x.q.text.slice(0,100))}</td><td>${x.fails}</td></tr>`).join('')||'<tr><td class="mu">Sin datos</td></tr>'}</table></div>`;
 const c=$('cv').getContext('2d'),s=getComputedStyle(document.documentElement),p=h.slice(-30);c.strokeStyle=s.getPropertyValue('--bd');c.fillStyle=s.getPropertyValue('--mu');c.font='11px sans-serif';
 for(let i=0;i<=10;i+=5){const y=190-i*17;c.beginPath();c.moveTo(30,y);c.lineTo(690,y);c.stroke();c.fillText(i,8,y+4)}
 if(+CFG.corte){const y=190-CFG.corte*17;c.save();c.setLineDash([6,4]);c.strokeStyle=s.getPropertyValue('--ko');c.beginPath();c.moveTo(30,y);c.lineTo(690,y);c.stroke();c.restore();c.fillStyle=s.getPropertyValue('--ko');c.fillText('objetivo '+f2(CFG.corte),600,y-4)}
 c.strokeStyle=s.getPropertyValue('--ac');c.lineWidth=2;c.beginPath();p.forEach((x,i)=>{const px=40+(p.length>1?i*(640/(p.length-1)):320),py=190-x.nota*17;i?c.lineTo(px,py):c.moveTo(px,py)});c.stroke()}

const STOPW=new Set('de del la las el los y e o u en al un una unos unas por con para que se su sus lo a sobre acerca tema temas pregunta preguntas tecnica tecnicas hablen hablan relacionadas relacionado'.split(' '));
const words=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
const stem=w=>w.slice(0,6); // raíz aproximada: «arqueología/arqueológico/arqueólogos» → «arqueo»
function parseThemes(str){return str.split(/[,;\n]+/).map(t=>t.trim()).filter(Boolean).map(t=>({name:t,terms:t.split(/\s+/).map(tok=>[...new Set(tok.split('|').flatMap(w=>words(w)).filter(w=>w.length>2&&!STOPW.has(w)).map(stem))]).filter(g=>g.length)})).filter(t=>t.terms.length)}
const SC=new WeakMap();
function themeScore(q,th,loose){let c=SC.get(q);if(!c){const a=new Set(words(q.text+' '+(q.topic||'')).map(stem));c={a,all:new Set([...a,...words(q.opts.join(' ')).map(stem)])};SC.set(q,c)}
 const m=th.terms.filter(g=>g.some(t=>c.all.has(t))).length,need=loose?Math.ceil(th.terms.length/2):th.terms.length;
 return m>0&&m>=need?m/th.terms.length+th.terms.filter(g=>g.some(t=>c.a.has(t))).length/th.terms.length*.5:0}
function themedPick(pool,str,loose,n){const mk=th=>({th,list:pool.map(q=>[q,themeScore(q,th,loose)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])}),lists=[];
 // si un tema con «y» no encuentra nada, se separa en sub-temas («la alhambra y la restauración» → dos temas)
 parseThemes(str).forEach(th=>{const l=mk(th);if(l.list.length||!/\sy\s/.test(th.name))lists.push(l);else parseThemes(th.name.split(/\s+y\s+/).join(',')).forEach(t=>lists.push(mk(t)))});
 const W=lists.map(x=>x.list.filter(y=>y[0].ans>=0)),picked=[],seen=new Set(); // reparto equilibrado entre temas
 for(let r=0;picked.length<n;r++){let any=false;W.forEach(l=>{if(r<l.length){any=true;if(!seen.has(l[r][0].id)&&picked.length<n){seen.add(l[r][0].id);picked.push(l[r][0])}}});if(!any)break}

 const TM=CFG.temario.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(':');return i<0?null:{name:l.slice(0,i).trim(),th:parseThemes(l.slice(i+1))}}).filter(Boolean);let n=0;
 for(const q of await DB.all('preguntas')){if(q.topic&&!$('temOv').checked)continue;let best=null,bs=0;
  for(const t of TM){const sc=Math.max(0,...t.th.map(th=>themeScore(q,th,false)));if(sc>bs){bs=sc;best=t}}
  if(best&&best.name!==q.topic){q.topic=best.name;await DB.put('preguntas',q);n++}}toast(n+' preguntas clasificadas')};
async function dataInfo(){const [a,b,c]=await Promise.all([DB.all('preguntas'),DB.all('pdfs'),DB.all('historial')]);let u='';
 try{const e=await navigator.storage.estimate();u=` · ${(e.usage/1e6).toFixed(0)} MB usados`}catch(x){}
 $('dat').textContent=`Guardado en este navegador: ${a.length} preguntas · ${b.length} PDFs · ${c.length} tests${u}. ${WEB?'Al publicar una versión nueva en la misma dirección, los datos se conservan.':'Al actualizar la aplicación, guarda el archivo con el mismo nombre y en la misma carpeta: así los datos se conservan.'} Haz copias con «Exportar todo» (no incluye los PDFs).`}
/* ========== BANCO AUTOMÁTICO + RELACIÓN PREGUNTAS ↔ RESPUESTAS ========== */
const bankMap=async()=>new Map((await DB.all('preguntas')).map(q=>[q.hash,q]));
/* Todas las preguntas pasan al banco sin aprobar una a una (las dudosas / sin respuesta quedan marcadas).
   Una pregunta ya existente en otro examen no se duplica: suma una aparición. */
async function autoAdd(qs,bm){let add=0,merged=0,skipped=0;
 for(const q of qs){delete q.dup;const ex=bm.get(q.hash);
  if(!ex){await DB.put('preguntas',q);bm.set(q.hash,q);add++}
  else if(ex.file!==q.file||(ex.grp||0)!==(q.grp||0)){ex.veces=(ex.veces||1)+1;ex.anios=[...new Set([...(ex.anios||[ex.anio]),q.anio].filter(Boolean))];(ex.orig=ex.orig||[]).push({file:q.file,grp:q.grp||0,num:q.num});
   if(ex.ans<0&&q.ans>=0){ex.ans=q.ans;ex.status=q.status}await DB.put('preguntas',ex);merged++}
  else{if(ex.ans<0&&q.ans>=0){ex.ans=q.ans;ex.status=q.status;await DB.put('preguntas',ex)}skipped++}}
 return{add,merged,skipped}}
/* Lee un PDF de respuestas: devuelve un grupo por examen {anio, pairs:{nº:letra}}. Un número repetido o una nueva cabecera con otro año inicia un examen nuevo. */
function parseSolutions(lines,file){const gs=[],YR=/\b(?:19|20)\d\d\b/;let cur=null,yr=(YR.exec(file||'')||[''])[0];
 const start=()=>{cur={anio:yr,pairs:{}};gs.push(cur)};
 for(const l of lines){const t=l.t;
  if(t.length<130&&/examen|convocatoria|proceso selectivo|ejercicio|plantilla|respuestas|soluciones/i.test(t)&&YR.test(t)){const y=YR.exec(t)[0];
   if(cur&&Object.keys(cur.pairs).length&&y!==cur.anio){yr=y;cur=null}else if(!cur||!Object.keys(cur.pairs).length){yr=y;if(cur)cur.anio=y}continue}
  const rx=/(\d{1,3})\s*[.\-–:)]*\s*([a-eA-E])(?![a-zA-Záéíóúñ])/g;let m;
  while(m=rx.exec(t)){const n=+m[1];if(n<1||n>300)continue;if(!cur||cur.pairs[n]!=null)start();cur.pairs[n]=L.indexOf(m[2].toUpperCase())}}
 return gs.filter(g=>Object.keys(g.pairs).length)}
const STOPF=new Set('examen examenes respuestas respuesta soluciones solucion solucionario plantilla plantillas claves clave pdf de del la el y oposiciones convocatoria cuestionario preguntas test'.split(' '));
const fw=n=>new Set(words(n.replace(/\.pdf$/i,'')).filter(w=>!STOPF.has(w)&&w.length>1));
/* Empareja cada examen de respuestas con el examen de preguntas que mejor encaja (año, parecido de nombres y cobertura de la numeración).
   Es independiente del orden: se ejecuta tras cada importación, también si las respuestas se subieron antes que las preguntas. */
async function linkAnswers(){const pdfs=await DB.all('pdfs'),bank=await DB.all('preguntas'),G=new Map();
 const add=(file,grp,anio,q,num)=>{const k=file+'|'+(grp||0);let g=G.get(k);if(!g)G.set(k,g={file,grp:grp||0,anio:'',mem:[]});g.mem.push({q,num});if(!g.anio&&anio)g.anio=anio};
 bank.forEach(q=>{add(q.file,q.grp,q.anio,q,q.num);(q.orig||[]).forEach(o=>add(o.file,o.grp,null,q,o.num))});
 const sgs=[];pdfs.filter(p=>p.tipo==='respuestas').forEach(p=>(p.solGroups||[]).forEach((g,i)=>sgs.push({pdf:p,i,g,n:Object.keys(g.pairs).length})));
 const cand=[];
 for(const sg of sgs)for(const qg of G.values()){const nums=qg.mem.map(m=>m.num).filter(Boolean);if(nums.length<5&&!(nums.length>=3&&sg.g.anio&&qg.anio&&sg.g.anio===qg.anio))continue; // examen muy corto: solo si coincide el año
  const cov=nums.filter(n=>sg.g.pairs[n]!=null).length/nums.length;if(cov<0.6)continue;
  const a=fw(sg.pdf.name),b=fw(qg.file),jac=[...a].filter(x=>b.has(x)).length/(new Set([...a,...b]).size||1),ya=sg.g.anio||'',yb=qg.anio||'';
  cand.push({sg,qg,cov,sc:cov*3+jac*4+(ya&&yb&&ya===yb?5:0)-(ya&&yb&&ya!==yb?4:0)+(Math.abs(sg.n-nums.length)<=2?1:0)})}
 cand.sort((x,y)=>y.sc-x.sc);const uS=new Set(),uQ=new Set(),res=[],links={};
 for(const c of cand){const ks=c.sg.pdf.name+'|'+c.sg.i,kq=c.qg.file+'|'+c.qg.grp;if(uS.has(ks)||uQ.has(kq)||c.sc<2.5)continue;uS.add(ks);uQ.add(kq);
  let set=0,conf=0;const tc=new Set();
  for(const m of c.qg.mem){const v=c.sg.g.pairs[m.num];if(v==null||v>=m.q.opts.length)continue;
   if(m.q.ans<0){m.q.ans=v;m.q.status='confirmada';m.q.ocr=false;m.q.src='plantilla';set++;tc.add(m.q)}
   else if(m.q.ans!==v){if(m.q.src!=='manual'&&!m.q.conflicto){m.q.status='dudosa';m.q.conflicto=true;conf++;tc.add(m.q)}}
   else if(m.q.status!=='confirmada'){m.q.status='confirmada';tc.add(m.q)}}
  for(const q of tc)await DB.put('preguntas',q);
  res.push({fq:c.qg.file+(c.qg.anio?` (${c.qg.anio})`:''),a:c.sg.pdf.name,set,conf,tot:c.qg.mem.length});
  (links[c.qg.file]=links[c.qg.file]||new Set()).add(c.sg.pdf.name);(links[c.sg.pdf.name]=links[c.sg.pdf.name]||new Set()).add(c.qg.file)}
 for(const p of pdfs){const v=links[p.name]?[...links[p.name]].join(', '):'';if((p.vinculo||'')!==v){p.vinculo=v;await DB.put('pdfs',p)}}
 const fresh=await DB.all('preguntas');
 return{res,huerf:sgs.filter(x=>!uS.has(x.pdf.name+'|'+x.i)).map(x=>x.pdf.name+(x.g.anio?` (${x.g.anio})`:'')),sin:fresh.filter(q=>q.ans<0).length,dud:fresh.filter(q=>q.status==='dudosa').length}}
function showLink(r,sum){const el=$('linkrep');if(!el)return;
 el.innerHTML=`<div class="box"><b>Resultado de la importación</b>${sum.map(x=>`<div>${E(x)}</div>`).join('')}${r.res.map(x=>`<div class="mu">🔗 ${E(x.fq)} ← ${E(x.a)}: ${x.set} respuestas asignadas${x.conf?' · '+x.conf+' no coinciden con la marcada':''} (${x.tot} preguntas)</div>`).join('')}${r.huerf.map(n=>`<div class="mu">⚠ Sin pareja: ${E(n)}. No hay un examen de preguntas con esa numeración y año; se relacionará solo cuando lo importes.</div>`).join('')}<div class="row">${r.sin?`<button data-act="gostat" data-s="sin respuesta">Ver preguntas sin respuesta (${r.sin})</button>`:''}${r.dud?`<button data-act="gostat" data-s="dudosa">Ver dudosas (${r.dud})</button>`:''}</div></div>`}
A.gostat=e=>{BK.status=e.dataset.s;go('banco')};
A.relink=async()=>{const r=await linkAnswers();showLink(r,[]);viewLib();toast('Respuestas relacionadas')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&b.tagName!=='SELECT'&&A[b.dataset.act]){A[b.dataset.act](b);return}
 if(e.target.closest('#drop'))$('fi').click()});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.act;
 if(a&&t.tagName==='SELECT'&&A[a]){A[a](t);return}
 if(t.id==='fi')importFiles(t.files);if(t.id==='fj'&&t.files[0])importAll(t.files[0]);
 const c=t.closest&&t.closest('.card[data-i]');if(c&&t.dataset.f){const q=LIST[c.dataset.i],f=t.dataset.f;
  if(f==='text')q.text=t.value;else if(f==='opt')q.opts[+t.dataset.o]=t.value;else if(f==='topic')q.topic=t.value;else if(f==='ans'){q.ans=+t.value;q.status=q.ans<0?'sin respuesta':'confirmada';q.ocr=false;q.src='manual';q.conflicto=false}else if(f==='nota')q.nota=t.value;else if(f==='ley')q.ley=t.value;else if(f==='excl')q.excl=t.checked;if(R.qs.includes(q))DB.put('pendientes',q)}});
document.addEventListener('input',e=>{if(e.target.id==='bq'){BK.q=e.target.value;clearTimeout(input.h);input.h=setTimeout(async()=>{await viewBank();const i=$('bq');i.focus();i.setSelectionRange(99,99)},300)}});
const input={};
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#drop')){e.preventDefault();$('drop').classList.add('hv')}});
document.addEventListener('dragleave',()=>{$('drop')&&$('drop').classList.remove('hv')});
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#drop')){e.preventDefault();$('drop').classList.remove('hv');importFiles(e.dataTransfer.files)}});
document.addEventListener('keydown',e=>{if(!T||!T.run||VIEW!=='test'||T.summary||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
 const k=e.key.toUpperCase();if(L.includes(k)&&k.length===1||['Enter','ArrowRight','ArrowLeft'].includes(e.key))e.preventDefault();if(L.includes(k)&&k.length===1)answer(L.indexOf(k));else if(e.key==='Enter')A.next();else if(e.key==='ArrowRight')goQ(T.cur+1);else if(e.key==='ArrowLeft')goQ(T.cur-1)});

/* ========== ARRANQUE ========== */
(async()=>{try{await DB.open();Object.assign(CFG,(await DB.get('config','cfg'))||{});await ensureLibs();
 if(!CFG.leyMig){const up=(await DB.all('preguntas')).filter(q=>q.ley===undefined);up.forEach(q=>q.ley=extractLey(q));await DB.putMany('preguntas',up);CFG.leyMig=1;await saveCfg()}for(const p of await DB.all('pdfs'))if(p.data){await DB.put('pdfdata',{name:p.name,data:p.data});delete p.data;await DB.put('pdfs',p)}
 const pend=await DB.all('pendientes');if(pend.length){await autoAdd(pend,await bankMap());await DB.clear('pendientes');await linkAnswers()}applyTheme();
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 if(await DB.get('config','run'))go('test');else go('importar');syncFile(false)}
 catch(e){console.error(e);$('main').innerHTML='<div class="banner">No se puede usar el almacenamiento del navegador (IndexedDB). Evita el modo privado.</div>'}})();
